# path: crs-microservices/docker-compose.yml
# purpose: dinh nghia 5 service + 3 MySQL container, dung mang noi bo Docker de goi nhau qua TEN SERVICE thay vi localhost. Day la file THAM KHAO cho sinh vien tu hoc, khong bat buoc phai chay dung trong 10 buoi tren lop.

version: '3.8'

services:
  mysql-auth:
    image: mysql:8
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql

  mysql-course:
    image: mysql:8
    container_name: mysql-course
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: course_db
    ports:
      - "3308:3306"
    volumes:
      - course-db-data:/var/lib/mysql

  mysql-registration:
    image: mysql:8
    container_name: mysql-registration
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: registration_db
    ports:
      - "3309:3306"
    volumes:
      - registration-db-data:/var/lib/mysql

  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - mysql-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8081:8081"

  course-service:
    build: ./course-service
    container_name: course-service
    depends_on:
      - mysql-course
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-course:3306/course_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8085:8085"

  registration-service:
    build: ./registration-service
    container_name: registration-service
    depends_on:
      - mysql-registration
      - course-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-registration:3306/registration_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
      COURSE_SERVICE_BASE_URL: http://course-service:8085
    ports:
      - "8083:8083"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - auth-service
      - course-service
      - registration-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8085
      REGISTRATION_SERVICE_URL: http://registration-service:8083
    ports:
      - "8080:8080"

volumes:
  auth-db-data:
  course-db-data:
  registration-db-data:
